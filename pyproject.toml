[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidro-mg-lakehouse"
version = "0.1.0"
description = "Lakehouse medalhão no Databricks (bronze, silver, gold) e orquestração com Airflow e dbt"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]
# PySpark remoto no Databricks a partir do VS Code (Databricks Connect).
# Verificado em 18/11/2026: Connect 18.3.8 (Python 3.12) funciona no serverless do Free Edition
# (leitura do volume, criação e consulta de tabelas Delta).
databricks = ["databricks-connect>=18.0,<19"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
